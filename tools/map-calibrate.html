<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map pin calibrator — Gohyaku Rakanji</title>
<!--
  Local tool. Not part of the deployed site.

  IMPORTANT — why this frame is phone-shaped:
  .map-image in styles.css uses `object-fit: cover`, so the map is CROPPED to
  fill whatever container it is in, and pins are positioned against that
  container rather than against the image. That means a pin percentage does not
  point at a fixed spot on the map — it moves as the screen's aspect ratio
  changes. On a 390x560 phone, 14% is cropped off the sides; in a 1200x700
  laptop window, 53% is cropped off the top and bottom.

  So pins calibrated in a wide browser window land somewhere else on a phone.
  This frame reproduces the phone geometry exactly: same container ratio, same
  object-fit, same 30px pin. Calibrate here and it will be right on a phone.
-->
<style>
  :root {
    --bg: #f6f4f1; --panel: #fff; --ink: #1c1a1f; --muted: #6b6670;
    --line: #e2dcd5; --sel: #1c6e8c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121114; --panel: #1a181d; --ink: #ede8e3; --muted: #9a939c;
            --line: #302b34; --sel: #6fb8d6; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: auto 340px; gap: 24px;
    padding: 20px; align-items: start; justify-content: center;
  }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; } }

  h1 { font-size: 1.05rem; margin: 0 0 2px; }
  p.hint { color: var(--muted); font-size: .82rem; margin: 0 0 14px; max-width: 42ch; }

  /* Mirrors .map-stage / .map-inner / .map-image / .map-pin from styles.css */
  #frame {
    position: relative; overflow: hidden; border-radius: 10px;
    border: 1px solid var(--line); background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,.14);
    touch-action: none; user-select: none;
  }
  #frame img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    pointer-events: none; -webkit-user-drag: none;
  }
  #pins { position: absolute; inset: 0; }

  .pin {
    position: absolute; transform: translate(-50%, -50%);
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid #fff;
    background: linear-gradient(135deg, #f6515f, #db3f4c);
    color: #fff; font: 800 13px/1 sans-serif;
    display: flex; align-items: center; justify-content: center;
    cursor: grab; box-shadow: 0 2px 8px rgba(0,0,0,.55), 0 0 0 2px rgba(246,81,95,.35);
  }
  .pin.dragging { cursor: grabbing; z-index: 20; }
  .pin.sel { outline: 2px solid var(--sel); outline-offset: 3px; }
  .pin.moved { border-color: #ffe08a; }

  aside { position: sticky; top: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 13px; margin-bottom: 12px; }
  label { font: 600 .72rem/1 ui-monospace, monospace; letter-spacing: .07em;
          text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
  select, button {
    font: 600 13px -apple-system, sans-serif; padding: 7px 12px;
    border-radius: 5px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer;
  }
  select { width: 100%; }
  button.primary { background: #b23d26; color: #fff; border-color: transparent; }
  button:hover { filter: brightness(1.08); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  textarea {
    width: 100%; height: 300px; font: 12px/1.5 ui-monospace, monospace;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 9px; resize: vertical;
  }
  .meta { font: 11px/1.5 ui-monospace, monospace; color: var(--muted); margin-top: 8px; }
  .warn { color: #b23d26; font-weight: 700; }
</style>
</head>
<body>

<div>
  <h1>Map pin calibrator <span style="font-weight:400;color:var(--muted)">— phone view</span></h1>
  <p class="hint">
    Drag a pin, or select one and use arrow keys (0.1%, Shift for 1%).
    The frame reproduces a phone exactly, including the side-cropping the real map does.
  </p>
  <div id="frame">
    <img id="map" alt="Temple grounds map"
         src="https://stg-apirakanjicom-stgrakanji.kinsta.cloud/wp-content/uploads/2026/03/Map_no_Numbers.jpg">
    <div id="pins"></div>
  </div>
  <div class="meta" id="cropInfo"></div>
</div>

<aside>
  <div class="panel">
    <label for="device">Device</label>
    <select id="device">
      <option value="390,560" selected>iPhone 14 / 15 — 390×560</option>
      <option value="375,500">iPhone SE — 375×500</option>
      <option value="430,620">iPhone Pro Max — 430×620</option>
      <option value="360,540">Android common — 360×540</option>
      <option value="820,1000">iPad portrait — 820×1000</option>
    </select>
    <div class="meta"><span id="movedCount">0</span> of 20 moved</div>
    <div class="row">
      <button class="primary" id="copyBtn">Copy for script.js</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>
  <div class="panel">
    <textarea id="out" readonly spellcheck="false"></textarea>
  </div>
</aside>

<script>
// Current live values from assets/js/script.js — keep in sync when they change.
const ORIGINAL = {
  1: [54, 97.4],   2: [56.1, 78.7], 3: [56.2, 70.4], 4: [59.2, 71.7],
  5: [69.2, 71.4], 6: [70.8, 61.6], 7: [58.6, 49],   8: [60.2, 53.5],
  9: [61.1, 35.3], 10: [73, 20.9],  11: [35.3, 28.3], 12: [34.1, 22.8],
  13: [36.9, 16.8], 14: [47.7, 16.6], 15: [50.8, 22.9], 16: [29.7, 43.2],
  17: [41.4, 39.4], 18: [40.6, 49.6], 19: [33.3, 50],  20: [26.9, 60.9],
};
const IMG_W = 750, IMG_H = 930;

const pos = structuredClone(ORIGINAL);
const frame = document.getElementById("frame");
const pinLayer = document.getElementById("pins");
const out = document.getElementById("out");
let selected = null;

const r1 = (n) => Math.round(n * 10) / 10;
const clamp = (n) => Math.min(100, Math.max(0, n));
const moved = (n) => pos[n][0] !== ORIGINAL[n][0] || pos[n][1] !== ORIGINAL[n][1];

function setDevice() {
  const [w, h] = document.getElementById("device").value.split(",").map(Number);
  frame.style.width = w + "px";
  frame.style.height = h + "px";

  const ca = w / h, ia = IMG_W / IMG_H;
  let crop, axis;
  if (ca < ia) { crop = (1 - w / (h * ia)) * 100; axis = "left/right"; }
  else { crop = (1 - h / (w / ia)) * 100; axis = "top/bottom"; }
  document.getElementById("cropInfo").textContent =
    `${w}×${h} — object-fit: cover crops ${crop.toFixed(1)}% off ${axis}`;
}

function render() {
  for (const n of Object.keys(pos)) {
    const el = document.getElementById("pin" + n);
    el.style.left = pos[n][0] + "%";
    el.style.top = pos[n][1] + "%";
    el.classList.toggle("moved", moved(n));
    el.classList.toggle("sel", selected === n);
  }
  document.getElementById("movedCount").textContent = Object.keys(pos).filter(moved).length;
  out.value = "const MAP_PIN_POSITIONS = {\n" +
    Object.keys(pos).sort((a, b) => a - b)
      .map((n) => `  ${n}: [${pos[n][0]}, ${pos[n][1]}],`).join("\n") + "\n};";
}

for (const n of Object.keys(pos)) {
  const el = document.createElement("div");
  el.className = "pin";
  el.id = "pin" + n;
  el.textContent = n;
  el.tabIndex = 0;
  pinLayer.appendChild(el);

  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    selected = n;
    el.classList.add("dragging");
    el.setPointerCapture(e.pointerId);
    render();
  });
  el.addEventListener("pointermove", (e) => {
    if (!el.classList.contains("dragging")) return;
    const r = frame.getBoundingClientRect();
    pos[n] = [r1(clamp(((e.clientX - r.left) / r.width) * 100)),
              r1(clamp(((e.clientY - r.top) / r.height) * 100))];
    render();
  });
  const end = (e) => {
    el.classList.remove("dragging");
    try { el.releasePointerCapture(e.pointerId); } catch {}
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("focus", () => { selected = n; render(); });
}

document.addEventListener("keydown", (e) => {
  if (!selected) return;
  const s = e.shiftKey ? 1 : 0.1;
  const d = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] }[e.key];
  if (!d) return;
  e.preventDefault();
  pos[selected] = [r1(clamp(pos[selected][0] + d[0])), r1(clamp(pos[selected][1] + d[1]))];
  render();
});

document.getElementById("device").addEventListener("change", setDevice);
document.getElementById("resetBtn").addEventListener("click", () => {
  Object.assign(pos, structuredClone(ORIGINAL)); render();
});
document.getElementById("copyBtn").addEventListener("click", async () => {
  const b = document.getElementById("copyBtn");
  try { await navigator.clipboard.writeText(out.value); b.textContent = "Copied"; }
  catch { out.select(); b.textContent = "Select + ⌘C"; }
  setTimeout(() => (b.textContent = "Copy for script.js"), 1600);
});

setDevice();
render();
</script>
</body>
</html>
