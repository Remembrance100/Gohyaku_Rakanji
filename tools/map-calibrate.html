<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map pin calibrator — Gohyaku Rakanji</title>
<!--
  Local tool, not part of the deployed site.

  Drag the pins onto the right spots, then copy the generated block over
  MAP_PIN_POSITIONS in assets/js/script.js (around line 1531).

  Positions are percentages of the map image, which is how the tour stores
  them — so they stay correct at any screen size. Open this file directly in
  a browser; it needs no server.
-->
<style>
  :root {
    --bg: #f6f4f1; --panel: #fff; --ink: #1c1a1f; --muted: #6b6670;
    --line: #e2dcd5; --pin: #b23d26; --pin-active: #1c6e8c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121114; --panel: #1a181d; --ink: #ede8e3; --muted: #9a939c;
      --line: #302b34; --pin: #e8785f; --pin-active: #6fb8d6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 1fr 340px; gap: 20px;
    padding: 20px; min-height: 100vh; align-items: start;
  }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } }

  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  p.hint { color: var(--muted); font-size: .85rem; margin: 0 0 14px; }

  #stage { position: relative; user-select: none; touch-action: none; }
  #stage img { display: block; width: 100%; height: auto; border-radius: 6px; }

  .pin {
    position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%; background: var(--pin); color: #fff;
    font: 700 13px/30px -apple-system, sans-serif; text-align: center;
    cursor: grab; box-shadow: 0 1px 5px rgba(0,0,0,.4);
    border: 2px solid rgba(255,255,255,.85);
  }
  .pin:active, .pin.dragging { cursor: grabbing; background: var(--pin-active); z-index: 10; }
  .pin.moved { outline: 2px solid var(--pin-active); outline-offset: 2px; }

  aside { position: sticky; top: 20px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 14px; margin-bottom: 12px;
  }
  textarea {
    width: 100%; height: 340px; font: 12px/1.5 ui-monospace, monospace;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 10px; resize: vertical;
  }
  button {
    font: 600 13px -apple-system, sans-serif; padding: 8px 14px;
    border-radius: 5px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--pin); color: #fff; border-color: transparent; }
  button:hover { filter: brightness(1.08); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .count { font: 600 12px ui-monospace, monospace; color: var(--muted); }
</style>
</head>
<body>

<div>
  <h1>Map pin calibrator</h1>
  <p class="hint">Drag any pin. Arrow keys nudge the selected pin by 0.1% (hold Shift for 1%).</p>
  <div id="stage">
    <img id="map" alt="Temple grounds map"
         src="https://stg-apirakanjicom-stgrakanji.kinsta.cloud/wp-content/uploads/2026/03/Map_no_Numbers.jpg">
  </div>
</div>

<aside>
  <div class="panel">
    <div class="count"><span id="movedCount">0</span> of 20 moved</div>
    <div class="row">
      <button class="primary" id="copyBtn">Copy for script.js</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>
  <div class="panel">
    <textarea id="out" readonly spellcheck="false"></textarea>
  </div>
</aside>

<script>
// Current values from assets/js/script.js — keep in sync if they change there.
const ORIGINAL = {
  1: [55.4, 96],   2: [56.7, 79.2], 3: [57.2, 71.6], 4: [69.4, 70.1],
  5: [79.3, 69.8], 6: [79.1, 61.1], 7: [78.8, 52],   8: [65.1, 52],
  9: [64.7, 36.4], 10: [78.8, 19.6], 11: [35.3, 28.3], 12: [31.3, 21.6],
  13: [35, 15.2],  14: [42.8, 14.9], 15: [46.7, 21.3], 16: [25.8, 43.3],
  17: [41.3, 40.9], 18: [37.3, 50.9], 19: [26.3, 51.1], 20: [20.9, 68.3],
};

const pos = JSON.parse(JSON.stringify(ORIGINAL));
const stage = document.getElementById("stage");
const out = document.getElementById("out");
const movedCount = document.getElementById("movedCount");
let selected = null;

function round(n) { return Math.round(n * 10) / 10; }

function isMoved(n) {
  return pos[n][0] !== ORIGINAL[n][0] || pos[n][1] !== ORIGINAL[n][1];
}

function render() {
  for (const n of Object.keys(pos)) {
    const el = document.getElementById("pin" + n);
    el.style.left = pos[n][0] + "%";
    el.style.top = pos[n][1] + "%";
    el.classList.toggle("moved", isMoved(n));
  }
  movedCount.textContent = Object.keys(pos).filter(isMoved).length;
  out.value =
    "const MAP_PIN_POSITIONS = {\n" +
    Object.keys(pos).sort((a, b) => a - b)
      .map((n) => `  ${n}: [${pos[n][0]}, ${pos[n][1]}],`).join("\n") +
    "\n};";
}

for (const n of Object.keys(pos)) {
  const el = document.createElement("div");
  el.className = "pin";
  el.id = "pin" + n;
  el.textContent = n;
  el.tabIndex = 0;
  stage.appendChild(el);

  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    selected = n;
    el.classList.add("dragging");
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener("pointermove", (e) => {
    if (!el.classList.contains("dragging")) return;
    const r = stage.getBoundingClientRect();
    pos[n] = [
      round(Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100))),
      round(Math.min(100, Math.max(0, ((e.clientY - r.top) / r.height) * 100))),
    ];
    render();
  });

  const end = (e) => { el.classList.remove("dragging"); try { el.releasePointerCapture(e.pointerId); } catch {} };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("focus", () => { selected = n; });
}

document.addEventListener("keydown", (e) => {
  if (!selected) return;
  const step = e.shiftKey ? 1 : 0.1;
  const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (!d) return;
  e.preventDefault();
  pos[selected] = [
    round(Math.min(100, Math.max(0, pos[selected][0] + d[0]))),
    round(Math.min(100, Math.max(0, pos[selected][1] + d[1]))),
  ];
  render();
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const btn = document.getElementById("copyBtn");
  try { await navigator.clipboard.writeText(out.value); btn.textContent = "Copied"; }
  catch { out.select(); btn.textContent = "Select + ⌘C"; }
  setTimeout(() => (btn.textContent = "Copy for script.js"), 1600);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  Object.assign(pos, JSON.parse(JSON.stringify(ORIGINAL)));
  render();
});

render();
</script>
</body>
</html>
