<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080c" />
    <meta name="robots" content="noindex, nofollow" />
    <title>受付用｜本日のアクセスコード</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
        background: #000;
        color: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100svh;
        padding: 1.5rem;
      }

      .card {
        width: min(100%, 360px);
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        text-align: center;
      }

      h1 {
        font-size: 1.1rem;
        margin: 0;
        color: rgba(255,255,255,0.7);
        font-weight: 700;
      }

      .gate {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      input[type="password"] {
        width: 100%;
        height: 50px;
        border-radius: 10px;
        border: 1.5px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.05);
        color: #f6f6f6;
        font-size: 1rem;
        text-align: center;
        padding: 0 0.75rem;
      }

      button {
        height: 50px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #f6515f, #db3f4c);
        color: #fff;
        font-weight: 800;
        letter-spacing: 0.04em;
        cursor: pointer;
      }

      button:disabled { opacity: 0.5; cursor: not-allowed; }

      .code-display { display: none; flex-direction: column; gap: 0.4rem; }

      .code {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: #fff;
      }

      .date {
        color: rgba(255,255,255,0.4);
        font-size: 0.85rem;
      }

      .hint {
        color: rgba(255,255,255,0.35);
        font-size: 0.8rem;
        line-height: 1.5;
      }

      .error {
        display: none;
        color: #f6515f;
        font-size: 0.85rem;
      }

      .error.is-visible { display: block; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>本日のアクセスコード</h1>

      <div class="gate" id="gate">
        <input type="password" id="keyInput" placeholder="パスフレーズ" autocomplete="off" />
        <button id="unlockBtn" type="button">表示する</button>
        <div class="error" id="gateError">パスフレーズが違います。</div>
      </div>

      <div class="code-display" id="codeDisplay">
        <div class="code" id="codeValue">------</div>
        <div class="date" id="dateValue"></div>
        <button id="refreshBtn" type="button">再取得</button>
      </div>

      <p class="hint">コードは日本時間の深夜0時に自動的に切り替わります。</p>
    </div>

    <script>
      const STAFF_KEY_STORAGE = "staffCashKey";

      const gate = document.getElementById("gate");
      const gateError = document.getElementById("gateError");
      const keyInput = document.getElementById("keyInput");
      const unlockBtn = document.getElementById("unlockBtn");
      const codeDisplay = document.getElementById("codeDisplay");
      const codeValue = document.getElementById("codeValue");
      const dateValue = document.getElementById("dateValue");
      const refreshBtn = document.getElementById("refreshBtn");

      const MESSAGES = {
        wrongKey: "パスフレーズが違います。",
        failed: "コードを取得できませんでした。通信状況をご確認のうえ、もう一度お試しください。",
      };

      // The API sends the date as YYYY-MM-DD (JST). Build it in UTC and format
      // it in UTC so the day can't shift with the device's own time zone.
      function formatDate(isoDate) {
        const [y, m, d] = String(isoDate).split("-").map(Number);
        if (!y || !m || !d) return String(isoDate || "");
        return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("ja-JP", {
          timeZone: "UTC",
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "short",
        });
      }

      // Resolves to { data } on success, or { status } on failure (status 0 =
      // the request never got an answer), so the caller can tell a wrong
      // passphrase (401) from everything else.
      async function fetchCode(key) {
        try {
          const res = await fetch("/api/staff-cash-code?key=" + encodeURIComponent(key));
          if (!res.ok) return { status: res.status };
          return { data: await res.json() };
        } catch {
          return { status: 0 };
        }
      }

      async function tryUnlock(key) {
        unlockBtn.disabled = true;
        gateError.classList.remove("is-visible");

        const { data, status } = await fetchCode(key);

        unlockBtn.disabled = false;

        if (!data || !data.code) {
          if (status === 401) sessionStorage.removeItem(STAFF_KEY_STORAGE);
          gateError.textContent = status === 401 ? MESSAGES.wrongKey : MESSAGES.failed;
          gateError.classList.add("is-visible");
          return;
        }

        sessionStorage.setItem(STAFF_KEY_STORAGE, key);
        codeValue.textContent = data.code;
        dateValue.textContent = formatDate(data.date);
        gate.style.display = "none";
        codeDisplay.style.display = "flex";
      }

      unlockBtn.addEventListener("click", () => {
        const key = keyInput.value.trim();
        if (!key) return;
        tryUnlock(key);
      });

      keyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") unlockBtn.click();
      });

      refreshBtn.addEventListener("click", async () => {
        const key = sessionStorage.getItem(STAFF_KEY_STORAGE);
        if (!key) return;
        const { data } = await fetchCode(key);
        if (data && data.code) {
          codeValue.textContent = data.code;
          dateValue.textContent = formatDate(data.date);
        }
      });

      const savedKey = sessionStorage.getItem(STAFF_KEY_STORAGE);
      if (savedKey) tryUnlock(savedKey);
    </script>
  </body>
</html>
