<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080c" />
    <title>Memorial Tour Guide · Pay with Cash</title>
    <link
      rel="icon"
      href="./assets/icons/icon.png?v=20260725a"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="./assets/icons/icon.png?v=20260725a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700;800&family=Manrope:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --tour-font-scale: 1;
        --tour-text-size: calc(1rem * var(--tour-font-scale));
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Manrope", sans-serif;
        font-size: var(--tour-text-size);
        background: #000;
        color: #f2f2f2;
        display: flex;
        justify-content: center;
        min-height: 100svh;
      }

      .pay-card {
        width: min(100%, 420px);
        padding: 1.5rem 1.25rem 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
      }

      .nav-back {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        align-self: flex-start;
        background: none;
        border: none;
        padding: 0;
        color: rgba(255, 255, 255, 0.55);
        font:
          700 var(--tour-text-size) "Manrope",
          sans-serif;
        cursor: pointer;
        transition: color 150ms;
      }

      .nav-back:hover {
        color: #fff;
      }

      .pay-title {
        margin: 0;
        font:
          800 var(--tour-text-size) / 1.2 "Barlow",
          sans-serif;
        color: #f6f6f6;
      }

      .pay-subtitle {
        margin: 0;
        font-size: var(--tour-text-size);
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.55;
      }

      .pay-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }

      .cash-notice {
        background: rgba(255, 255, 255, 0.05);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 1rem 1.1rem;
        font-size: var(--tour-text-size);
        color: rgba(255, 255, 255, 0.75);
        line-height: 1.55;
      }

      .code-label {
        display: block;
        font:
          700 calc(var(--tour-text-size) * 0.9) "Manrope",
          sans-serif;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 0.5rem;
      }

      .code-input {
        width: 100%;
        height: 54px;
        border-radius: 10px;
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.05);
        color: #f6f6f6;
        font:
          800 calc(var(--tour-text-size) * 1.4) "Barlow",
          sans-serif;
        letter-spacing: 0.4em;
        text-align: center;
        padding: 0 0.5rem;
      }

      .code-input:focus {
        outline: none;
        border-color: rgba(246, 81, 95, 0.6);
        background: rgba(246, 81, 95, 0.06);
      }

      .pay-btn {
        display: block;
        width: 100%;
        height: 54px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #f6515f, #db3f4c);
        color: #fff;
        font:
          800 var(--tour-text-size) "Barlow",
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(219, 63, 76, 0.4);
        transition: filter 150ms;
        position: relative;
      }

      .pay-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .pay-btn:not(:disabled):hover {
        filter: brightness(1.12);
      }

      .pay-btn-spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .pay-btn.is-loading .pay-btn-label {
        opacity: 0;
      }
      .pay-btn.is-loading .pay-btn-spinner {
        display: block;
      }

      @keyframes spin {
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      .pay-error {
        display: none;
        background: rgba(246, 81, 95, 0.12);
        border: 1px solid rgba(246, 81, 95, 0.35);
        border-radius: 8px;
        padding: 0.65rem 0.85rem;
        font-size: var(--tour-text-size);
        color: #f6515f;
        line-height: 1.45;
      }

      .pay-error.is-visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="pay-card">
      <button class="nav-back" id="navBack" type="button">
        <svg
          width="8"
          height="13"
          viewBox="0 0 8 13"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M7 1 1.5 6.5 7 12"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span id="navBackLabel">Back</span>
      </button>
      <div>
        <h1 class="pay-title" id="payTitle">Pay with Cash</h1>
        <p class="pay-subtitle" id="paySubtitle">
          Purchase access at the front desk, then enter today's code below.
        </p>
      </div>

      <div class="pay-divider"></div>

      <div class="cash-notice" id="cashNotice">
        Please visit the front desk to pay and receive today's access code.
      </div>

      <form id="codeForm">
        <label class="code-label" id="codeLabel" for="codeInput"
          >Access Code</label
        >
        <input
          class="code-input"
          id="codeInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          maxlength="6"
          pattern="\d{6}"
        />
      </form>

      <div class="pay-error" id="payError"></div>

      <button class="pay-btn" id="submitBtn" type="button">
        <span class="pay-btn-label" id="submitBtnLabel">Unlock</span>
        <span class="pay-btn-spinner" aria-hidden="true"></span>
      </button>
    </div>

    <script>
      const STRINGS = {
        ja: {
          back: "戻る",
          title: "現金でお支払い",
          subtitle:
            "受付にてお支払いいただき、本日のアクセスコードを入力してください。",
          notice:
            "受付にてお支払いいただくと、本日のアクセスコードをお伝えします。",
          codeLabel: "アクセスコード",
          btn: "ロック解除",
          error: "コードが正しくありません。受付にてご確認ください。",
          generic: "エラーが発生しました。もう一度お試しください。",
        },
        en: {
          back: "Back",
          title: "Pay with Cash",
          subtitle:
            "Purchase access at the front desk, then enter today's code below.",
          notice:
            "Please visit the front desk to pay and receive today's access code.",
          codeLabel: "Access Code",
          btn: "Unlock",
          error: "That code isn't right. Please check with the front desk.",
          generic: "Something went wrong. Please try again.",
        },
        ko: {
          back: "뒤로",
          title: "현금으로 결제",
          subtitle: "안내 데스크에서 결제 후 오늘의 접속 코드를 입력해 주세요.",
          notice: "안내 데스크에서 결제하시면 오늘의 접속 코드를 알려드립니다.",
          codeLabel: "접속 코드",
          btn: "잠금 해제",
          error: "코드가 올바르지 않습니다. 안내 데스크에 문의해 주세요.",
          generic: "오류가 발생했습니다. 다시 시도해 주세요.",
        },
        zh: {
          back: "返回",
          title: "现金支付",
          subtitle: "请在前台完成付款，然后在下方输入今日的访问代码。",
          notice: "请前往前台付款，工作人员会告知您今日的访问代码。",
          codeLabel: "访问代码",
          btn: "解锁",
          error: "代码不正确，请向前台确认。",
          generic: "出现错误，请重试。",
        },
      };

      function getLang() {
        try {
          const prefs = JSON.parse(localStorage.getItem("tourPrefs") || "{}");
          if (prefs.lang && STRINGS[prefs.lang]) return prefs.lang;
        } catch {}
        const browser = (navigator.language || "en").slice(0, 2).toLowerCase();
        return STRINGS[browser] ? browser : "en";
      }

      let lang = getLang();
      let t = STRINGS[lang];

      const fontScales = {
        small: 1.14,
        normal: 1.14,
        large: 1.14,
        xlarge: 1.3,
        xxlarge: 1.5,
      };

      function applyPrefs() {
        lang = getLang();
        t = STRINGS[lang];

        try {
          const prefs = JSON.parse(localStorage.getItem("tourPrefs") || "{}");
          if (fontScales[prefs.size]) {
            document.documentElement.style.setProperty(
              "--tour-font-scale",
              String(fontScales[prefs.size]),
            );
          }
        } catch {}

        document.documentElement.lang = lang;
        document.getElementById("payTitle").textContent = t.title;
        document.getElementById("paySubtitle").textContent = t.subtitle;
        document.getElementById("cashNotice").textContent = t.notice;
        document.getElementById("codeLabel").textContent = t.codeLabel;
        document.getElementById("submitBtnLabel").textContent = t.btn;
        document.getElementById("navBackLabel").textContent = t.back;
      }

      applyPrefs();

      document.getElementById("navBack").addEventListener("click", () => {
        window.location.href = "./pay-select.html";
      });

      const codeInput = document.getElementById("codeInput");
      const submitBtn = document.getElementById("submitBtn");
      const payError = document.getElementById("payError");

      codeInput.addEventListener("input", () => {
        codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
      });

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.classList.toggle("is-loading", loading);
      }

      function showError(msg) {
        payError.textContent = msg;
        payError.classList.add("is-visible");
      }

      function hideError() {
        payError.classList.remove("is-visible");
      }

      async function submitCode() {
        const code = codeInput.value.trim();
        if (!/^\d{6}$/.test(code)) {
          showError(t.error);
          return;
        }

        hideError();
        setLoading(true);

        try {
          const res = await fetch("/api/verify-cash-code", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code }),
          });
          const data = await res.json();

          if (!data.valid) {
            setLoading(false);
            showError(t.error);
            return;
          }

          localStorage.setItem("tourAccessToken", data.token);
          localStorage.setItem("tourAccessExpiry", String(data.expiry));
          window.location.href = "./index.html?skip_settings=1";
        } catch {
          setLoading(false);
          showError(t.generic);
        }
      }

      submitBtn.addEventListener("click", submitCode);
      document.getElementById("codeForm").addEventListener("submit", (e) => {
        e.preventDefault();
        submitCode();
      });

      window.addEventListener("pageshow", (e) => {
        if (!e.persisted) return;
        setLoading(false);
        applyPrefs();
      });
    </script>
  </body>
</html>
