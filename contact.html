<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080c" />
    <title>Memorial Tour Guide · Contact</title>
    <link rel="icon" href="./assets/icons/icon.png?v=20260725a" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icons/icon.png?v=20260725a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700;800&family=Manrope:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --tour-font-scale: 1;
        --tour-text-size: calc(1rem * var(--tour-font-scale));
      }

      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Manrope", sans-serif;
        font-size: var(--tour-text-size);
        background: #000;
        color: #f2f2f2;
        display: flex;
        justify-content: center;
        min-height: 100svh;
        padding: 1.5rem;
      }

      .contact-card {
        width: min(100%, 560px);
        background: #111114;
        border-top: 5px solid #f6515f;
        border-radius: 4px;
        padding: 1.6rem 1.4rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
        margin: 1rem 0;
      }

      .nav-back {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        align-self: flex-start;
        background: none;
        border: none;
        padding: 0;
        color: rgba(255, 255, 255, 0.55);
        font: 700 var(--tour-text-size) "Manrope", sans-serif;
        cursor: pointer;
        transition: color 150ms;
      }

      .nav-back:hover { color: #fff; }

      .contact-title {
        margin: 0;
        font: 800 calc(var(--tour-text-size) * 1.35) / 1.25 "Barlow", sans-serif;
        color: #f6f6f6;
      }

      .contact-intro {
        margin: 0;
        font-size: var(--tour-text-size);
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.5;
      }

      .contact-field {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .contact-field label {
        font: 800 calc(var(--tour-text-size) * 0.9) "Barlow", sans-serif;
        letter-spacing: 0.03em;
        color: #f6f6f6;
      }

      .contact-field input,
      .contact-field select,
      .contact-field textarea {
        width: 100%;
        background: #1a1a1e;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 0.7rem 0.8rem;
        color: #f2f2f2;
        font: 500 var(--tour-text-size) "Manrope", sans-serif;
        outline: none;
        transition: border-color 150ms;
      }

      .contact-field textarea {
        resize: vertical;
        min-height: 120px;
        line-height: 1.5;
      }

      .contact-field textarea::placeholder {
        color: rgba(255, 255, 255, 0.32);
        line-height: 1.5;
      }

      .contact-field input:focus,
      .contact-field select:focus,
      .contact-field textarea:focus {
        border-color: #f6515f;
      }

      .contact-field select {
        appearance: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
        background-repeat: no-repeat;
        background-position: right 0.75rem center;
        background-size: 16px;
        padding-right: 2.2rem;
      }

      .contact-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }

      .contact-error {
        display: none;
        margin: 0;
        border: 1px solid rgba(246, 81, 95, 0.35);
        background: rgba(246, 81, 95, 0.1);
        border-radius: 8px;
        padding: 0.7rem 0.85rem;
        font-size: calc(var(--tour-text-size) * 0.9);
        line-height: 1.5;
        color: #f6828d;
      }

      .contact-error.is-visible { display: block; }

      .submit-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .submit-btn {
        display: block;
        width: 100%;
        height: 54px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #f6515f, #db3f4c);
        color: #fff;
        font: 800 var(--tour-text-size) "Barlow", sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(219, 63, 76, 0.4);
        transition: filter 150ms;
      }

      .submit-btn:hover { filter: brightness(1.12); }

      .contact-success {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.6rem;
        padding: 1.5rem 0.5rem;
      }

      .contact-success.is-visible { display: flex; }
      .contact-form.is-hidden { display: none; }

      .contact-success-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(246, 81, 95, 0.12);
        color: #f6828d;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
      }

      .contact-success h2 {
        margin: 0;
        font: 800 calc(var(--tour-text-size) * 1.15) "Barlow", sans-serif;
        color: #f6f6f6;
      }

      .contact-success p {
        margin: 0;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.5;
      }

      .contact-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="contact-card">
      <button class="nav-back" id="navBack" type="button">
        <svg width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
          <path d="M7 1 1.5 6.5 7 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="navBackLabel">Back</span>
      </button>

      <div>
        <h1 class="contact-title" id="contactTitle">Contact Us</h1>
        <p class="contact-intro" id="contactIntro">
          Questions about a purchase, a technical problem with the guide, or general feedback — send us a message and we'll get back to you.
        </p>
      </div>

      <form class="contact-form" id="contactForm">
        <div class="contact-field">
          <label for="contactName" id="labelName">Name</label>
          <input type="text" id="contactName" name="name" autocomplete="name" required />
        </div>

        <div class="contact-field">
          <label for="contactEmail" id="labelEmail">Email</label>
          <input type="email" id="contactEmail" name="email" autocomplete="email" required />
        </div>

        <div class="contact-field">
          <label for="contactCategory" id="labelCategory">Category</label>
          <select id="contactCategory" name="category">
            <option value="payment" id="optPayment">Payment / purchase issue</option>
            <option value="technical" id="optTechnical">Technical problem with the guide</option>
            <option value="general" id="optGeneral">General question</option>
            <option value="other" id="optOther">Other</option>
          </select>
        </div>

        <div class="contact-field">
          <label for="contactMessage" id="labelMessage">Message</label>
          <textarea id="contactMessage" name="message" required></textarea>
        </div>

        <div class="contact-divider"></div>

        <p class="contact-error" id="contactError" role="alert"></p>

        <button class="submit-btn" id="submitBtn" type="submit">
          <span id="submitBtnLabel">Send Message</span>
        </button>
      </form>

      <div class="contact-success" id="contactSuccess">
        <div class="contact-success-icon" aria-hidden="true">✓</div>
        <h2 id="successTitle">Message received</h2>
        <p id="successBody">Thank you for reaching out. We'll get back to you as soon as we can.</p>
      </div>
    </div>

    <script>
      const STRINGS = {
        ja: {
          back: "戻る",
          title: "お問い合わせ",
          intro: "ご購入に関するご質問、音声ガイドの不具合、その他ご意見・ご要望など、お気軽にメッセージをお送りください。",
          labelName: "お名前",
          labelEmail: "メールアドレス",
          labelCategory: "カテゴリー",
          optPayment: "お支払い・購入について",
          optTechnical: "音声ガイドの不具合について",
          optGeneral: "一般的なご質問",
          optOther: "その他",
          labelMessage: "メッセージ",
          placeholderMessage:
            "通信環境、端末の不具合、コンテンツ等は返金は致しかねます",
          submit: "送信する",
          sending: "送信中…",
          errorBody:
            "送信に失敗しました。通信環境をご確認のうえ、しばらくしてからもう一度お試しください。うまくいかない場合は 500@rakan.or.jp まで直接お送りください。",
          successTitle: "メッセージを受け付けました",
          successBody: "お問い合わせいただきありがとうございます。担当者より追ってご連絡いたします。",
        },
        en: {
          back: "Back",
          title: "Contact Us",
          intro: "Questions about a purchase, a technical problem with the guide, or general feedback — send us a message and we'll get back to you.",
          labelName: "Name",
          labelEmail: "Email",
          labelCategory: "Category",
          optPayment: "Payment / purchase issue",
          optTechnical: "Technical problem with the guide",
          optGeneral: "General question",
          optOther: "Other",
          labelMessage: "Message",
          placeholderMessage:
            "We cannot issue refunds for network conditions, device malfunctions, or the content itself.",
          submit: "Send Message",
          sending: "Sending…",
          errorBody:
            "We couldn't send your message. Please check your connection and try again in a moment. If it still doesn't work, write to us directly at 500@rakan.or.jp.",
          successTitle: "Message received",
          successBody: "Thank you for reaching out. We'll get back to you as soon as we can.",
        },
        ko: {
          back: "뒤로",
          title: "문의하기",
          intro: "구매 관련 문의, 오디오 가이드 오류, 기타 의견 등 무엇이든 메시지를 보내주세요.",
          labelName: "이름",
          labelEmail: "이메일",
          labelCategory: "카테고리",
          optPayment: "결제/구매 관련 문의",
          optTechnical: "오디오 가이드 오류",
          optGeneral: "일반 문의",
          optOther: "기타",
          labelMessage: "메시지",
          placeholderMessage:
            "통신 환경, 단말기 오류, 콘텐츠 등을 이유로 한 환불은 불가합니다.",
          submit: "메시지 보내기",
          sending: "전송 중…",
          errorBody:
            "메시지를 보내지 못했습니다. 통신 환경을 확인하신 후 잠시 뒤에 다시 시도해 주세요. 계속 실패하면 500@rakan.or.jp 로 직접 보내주시기 바랍니다.",
          successTitle: "메시지가 접수되었습니다",
          successBody: "문의해 주셔서 감사합니다. 담당자가 곧 연락드리겠습니다.",
        },
        zh: {
          back: "返回",
          title: "联系我们",
          intro: "无论是购买相关问题、语音导览的技术故障，还是其他意见反馈，欢迎给我们留言。",
          labelName: "姓名",
          labelEmail: "邮箱",
          labelCategory: "类别",
          optPayment: "支付/购买问题",
          optTechnical: "语音导览技术故障",
          optGeneral: "一般咨询",
          optOther: "其他",
          labelMessage: "留言内容",
          placeholderMessage:
            "因网络环境、设备故障、内容等原因，恕不办理退款。",
          submit: "发送留言",
          sending: "发送中…",
          errorBody:
            "留言发送失败。请检查网络连接后稍后再试。如果仍然失败，请直接发送至 500@rakan.or.jp。",
          successTitle: "留言已收到",
          successBody: "感谢您的留言，我们会尽快与您联系。",
        },
      };

      // Falls back to Japanese, not to the browser's language, because this is
      // the one page reachable before a language has ever been chosen: the
      // Contact link sits on the entry settings screen, which itself opens in
      // Japanese. Guessing from navigator.language there would send a visitor
      // from a Japanese screen to an English one for no reason they can see.
      function getLang() {
        try {
          const prefs = JSON.parse(localStorage.getItem("tourPrefs") || "{}");
          if (prefs.lang && STRINGS[prefs.lang]) return prefs.lang;
        } catch {}
        return "ja";
      }

      const lang = getLang();
      const t = STRINGS[lang];

      const fontScales = { small: 1.14, normal: 1.14, large: 1.14, xlarge: 1.3, xxlarge: 1.5 };
      try {
        const prefs = JSON.parse(localStorage.getItem("tourPrefs") || "{}");
        if (fontScales[prefs.size]) {
          document.documentElement.style.setProperty("--tour-font-scale", String(fontScales[prefs.size]));
        }
      } catch {}

      document.documentElement.lang = lang;
      document.getElementById("contactTitle").textContent = t.title;
      document.getElementById("contactIntro").textContent = t.intro;
      document.getElementById("labelName").textContent = t.labelName;
      document.getElementById("labelEmail").textContent = t.labelEmail;
      document.getElementById("labelCategory").textContent = t.labelCategory;
      document.getElementById("optPayment").textContent = t.optPayment;
      document.getElementById("optTechnical").textContent = t.optTechnical;
      document.getElementById("optGeneral").textContent = t.optGeneral;
      document.getElementById("optOther").textContent = t.optOther;
      document.getElementById("labelMessage").textContent = t.labelMessage;
      document.getElementById("contactMessage").placeholder = t.placeholderMessage;
      document.getElementById("submitBtnLabel").textContent = t.submit;
      document.getElementById("successTitle").textContent = t.successTitle;
      document.getElementById("successBody").textContent = t.successBody;

      document.getElementById("navBackLabel").textContent = t.back;
      document.getElementById("navBack").addEventListener("click", () => {
        // Reachable from both the entry settings and the in-tour settings, so
        // return to whichever screen the visitor came from.
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "./index.html";
        }
      });

      const form = document.getElementById("contactForm");
      const submitBtn = document.getElementById("submitBtn");
      const submitLabel = document.getElementById("submitBtnLabel");
      const errorBox = document.getElementById("contactError");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.remove("is-visible");
        submitBtn.disabled = true;
        submitLabel.textContent = t.sending;

        try {
          const res = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: document.getElementById("contactName").value,
              email: document.getElementById("contactEmail").value,
              category: document.getElementById("contactCategory").value,
              message: document.getElementById("contactMessage").value,
              lang,
            }),
          });
          if (!res.ok) throw new Error(`send failed: ${res.status}`);

          form.classList.add("is-hidden");
          document.getElementById("contactSuccess").classList.add("is-visible");
        } catch (err) {
          console.error(err);
          errorBox.textContent = t.errorBody;
          errorBox.classList.add("is-visible");
          submitBtn.disabled = false;
          submitLabel.textContent = t.submit;
        }
      });
    </script>
  </body>
</html>
